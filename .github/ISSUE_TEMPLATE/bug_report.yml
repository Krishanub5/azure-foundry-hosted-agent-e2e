name: Bug report
description: Report a reproducible defect in the reference implementation
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, customer data, internal hostnames, or subscription details.
        Report security vulnerabilities privately according to SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Hosted Agent
        - Web UI/API
        - Document ingestion
        - Terraform
        - GitHub Actions
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe reproduction.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Sanitized environment
      description: Include versions and Azure region, but remove tenant and resource identifiers.
      placeholder: |
        Python:
        Terraform:
        Azure CLI:
        Region:
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed secrets and customer information.
          required: true
        - label: This is not a security vulnerability.
          required: true

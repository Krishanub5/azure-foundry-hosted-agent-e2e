name: Deploy end-to-end

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub Environment and deployment profile
        type: choice
        required: true
        options:
          - development
          - enterprise
      image_tag:
        description: Optional immutable image tag
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: foundry-agent-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'enterprise-agent' }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION || 'southeastasia' }}
      TF_VAR_environment: ${{ inputs.environment == 'enterprise' && 'prod' || 'dev' }}
      TF_VAR_enable_private_networking: ${{ inputs.environment == 'enterprise' }}
      TF_VAR_existing_firewall_private_ip: ${{ vars.FIREWALL_PRIVATE_IP || null }}
      TF_VAR_deployer_principal_id: ${{ vars.AZURE_CLIENT_OBJECT_ID }}
      TFVARS_FILE_OVERRIDE: ${{ github.workspace }}/.deployment/pipeline.tfvars

    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install deployment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt
          python -m pip install -r apps/ingestion/requirements.txt

      - name: Configure remote state
        run: |
          mkdir -p .deployment
          touch .deployment/pipeline.tfvars
          cp infra/terraform/backend.tf.example infra/terraform/backend.tf
          terraform -chdir=infra/terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=foundry-agent-${{ inputs.environment }}.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Validate and provision foundation
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform validate
          terraform -chdir=infra/terraform plan \
            -var-file="${TFVARS_FILE_OVERRIDE}" \
            -out="${GITHUB_WORKSPACE}/.deployment/foundation.tfplan"
          terraform -chdir=infra/terraform apply \
            "${GITHUB_WORKSPACE}/.deployment/foundation.tfplan"

      - name: Build and push images
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: ./scripts/build-and-push.sh "${{ inputs.environment }}" "${IMAGE_TAG}"

      - name: Deploy Hosted Agent
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          ./scripts/deploy-agent.sh "${{ inputs.environment }}" "${IMAGE_TAG}"
          ./scripts/post-deploy-rbac.sh "${{ inputs.environment }}"

      - name: Deploy ACI web UI
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: ./scripts/deploy-ui.sh "${{ inputs.environment }}" "${IMAGE_TAG}"

      - name: Ingest sample knowledge and smoke test
        run: |
          ./scripts/ingest.sh "${{ inputs.environment }}" sample-data
          ./scripts/smoke-test.sh "${{ inputs.environment }}"

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Microsoft Foundry deployment"
            echo
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Resource group: $(terraform -chdir=infra/terraform output -raw resource_group_name 2>/dev/null || echo unavailable)"
            echo "- Web URL: $(terraform -chdir=infra/terraform output -raw web_url 2>/dev/null || echo unavailable)"
          } >> "${GITHUB_STEP_SUMMARY}"

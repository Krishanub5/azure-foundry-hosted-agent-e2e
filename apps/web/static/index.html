<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Enterprise Knowledge Assistant</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="mark" aria-hidden="true">AI</div>
        <div>
          <h1 id="app-title">Enterprise Knowledge Assistant</h1>
          <p>Grounded answers from approved documents</p>
        </div>
        <button id="new-chat" class="secondary" type="button">New chat</button>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <article class="message assistant">
          <div class="bubble">
            Ask a question about the documents in the enterprise knowledge index.
            Answers will include source labels when evidence is available.
          </div>
        </article>
      </section>

      <form id="chat-form" class="composer">
        <label class="sr-only" for="message-input">Your message</label>
        <textarea
          id="message-input"
          rows="2"
          maxlength="16000"
          placeholder="Ask a grounded question…"
          required
        ></textarea>
        <button id="send-button" type="submit">Send</button>
      </form>
      <p class="notice">
        AI can make mistakes. Verify important decisions against the cited source.
      </p>
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
